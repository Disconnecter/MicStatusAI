---
name: Bug report
description: Report incorrect or unexpected MicStatusAI behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve MicStatusAI.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe observed behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MicStatusAI version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.0
    validations:
      required: true
  - type: input
    id: microphone
    attributes:
      label: Microphone or audio device
      placeholder: MacBook Microphone, USB device, virtual device, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: >-
        Remove private or sensitive information before attaching files.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I confirmed the issue with the latest release.
          required: true
