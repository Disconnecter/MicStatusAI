---
name: MicStatusAI

options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    CLANG_ENABLE_MODULES: "YES"
    CLANG_ENABLE_OBJC_ARC: "YES"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"

targets:
  MicStatusAI:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: MicStatusAI
        includes:
          - "**/*.swift"
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: Carbon.framework
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEAD_CODE_STRIPPING: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: MicStatusAI/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.disconnecter.MicStatusAI
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: SwiftLint not installed. Run: brew install swiftlint"
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml"

fileGroups:
  - MicStatusAI/Info.plist
  - .swiftlint.yml
  - README.md
  - project.yml

schemes:
  MicStatusAI:
    build:
      targets:
        MicStatusAI: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
