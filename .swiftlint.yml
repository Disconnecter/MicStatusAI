---
included:
  - MicStatusAI

excluded:
  - build
  - DerivedData
  - MicStatusAI/Generated

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - all

disabled_rules:
  - anonymous_argument_in_multiline_closure
  - conditional_returns_on_newline
  - contrasted_opening_brace
  - discouraged_default_parameter
  - explicit_acl
  - explicit_enum_raw_value
  - explicit_top_level_acl
  - explicit_type_interface
  - file_types_order
  - missing_docs
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_call_arguments
  - multiline_function_chains
  - multiline_parameters_brackets
  - no_magic_numbers
  - prefer_nimble
  - required_deinit
  - sorted_enum_cases
  - switch_case_on_newline
  - type_contents_order
  - vertical_whitespace_between_cases

strict: true
reporter: xcode

closure_body_length:
  warning: 100
  error: 150

function_body_length:
  warning: 60
  error: 100

identifier_name:
  excluded:
    - id

large_tuple: 3

number_separator:
  minimum_length: 5

redundant_self:
  keep_in_initializers: true
  only_in_closures: false

redundant_type_annotation:
  consider_default_literal_types_redundant: true

trailing_comma:
  mandatory_comma: true

type_body_length:
  warning: 400
  excluded_types: []

unneeded_override:
  affect_initializers: true

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

custom_rules:
  nonisolated_unsafe:
    name: Unsafe Nonisolated State
    message: Use actor isolation or a concurrency-safe resource owner.
    regex: 'nonisolated\(unsafe\)'
    severity: error
